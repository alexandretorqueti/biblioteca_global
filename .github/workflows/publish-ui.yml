name: Publicar biblioteca UI

on:
  push:
    tags:
      - "ui-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@alexandretorqueti"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar distribuição
        run: npm run build --workspace @alexandretorqueti/biblioteca-global-ui

      - name: Publicar no GitHub Packages
        run: npm publish --workspace @alexandretorqueti/biblioteca-global-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
