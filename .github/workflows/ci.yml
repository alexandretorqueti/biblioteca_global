name: CI - Migrations Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  migrations-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run db:generate for gerenteagentes
        run: npm run db:generate:gerenteagentes

      - name: Verify migrations are up to date
        run: |
          if ! git diff --exit-code projects/gerenteagentes/migrations/; then
            echo "❌ Migrations desatualizadas. Rode 'npm run db:generate:gerenteagentes' e commit as mudanças."
            exit 1
          fi
        working-directory: .

      - name: Build and test
        run: npm run build
