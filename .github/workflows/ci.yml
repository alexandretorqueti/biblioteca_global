name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: core
          MYSQL_USER: biblioteca
          MYSQL_PASSWORD: biblioteca-ci-password
        ports: ["3308:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3308
      MYSQL_DATABASE: core
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca-ci-password
      MYSQL_ROOT_PASSWORD: root-ci-password
      JWT_SECRET: ci-secret-with-at-least-32-characters
      API_PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
