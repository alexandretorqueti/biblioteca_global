services:
  biblioteca-gera:
    build: .
    container_name: biblioteca-gera
    ports:
      - "5174:5173"
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend-exemplo
    restart: unless-stopped

  backend-exemplo:
    build: ./apps/backend-exemplo
    container_name: backend_exemplo
    ports:
      - "3003:3001"
    volumes:
      - ./apps/backend-exemplo:/app
      - backend_node_modules:/app/node_modules
      - backend_data:/app/data
    environment:
      - PORT=3001
    restart: unless-stopped

volumes:
  backend_node_modules:
  backend_data:
