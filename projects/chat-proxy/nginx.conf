# Resolver dinâmico: com proxy_pass em variável, o nginx resolve o DNS a cada
# request (validade 10s) em vez de fixar o IP no boot. Assim o proxy sobrevive
# a rebuilds dos chats (IP novo) sem precisar de restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# Bundle único chat-universal: os dois domínios apontam para o mesmo container;
# a resolução do tenant (isa/alpha) é feita pela aplicação pelo Host original,
# por isso proxy_set_header Host $host é crítico e não pode mudar.
server {
    listen 80;
    server_name isa.globaltecnologia.net isa.webconnect.com.br;

    location / {
        set $isa_upstream http://biblioteca-global-chat-universal:80;
        proxy_pass $isa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name alpha.globaltecnologia.net alpha.webconnect.com.br;

    location / {
        set $alpha_upstream http://biblioteca-global-chat-universal:80;
        proxy_pass $alpha_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
