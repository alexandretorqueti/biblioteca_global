server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck simples (usado no smoke pós-deploy)
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy para API da Biblioteca.
    # Resolver dinâmico + variável: se o DNS do upstream falhar, o nginx loga
    # erro apenas no request (502) e NÃO aborta o boot (evita crash-loop quando
    # a API troca de nome/rede, ex.: deploy blue-green).
    # Alias estável "biblioteca-api" definido no docker-compose (rede compartilhada).
    resolver 127.0.0.11 valid=10s;
    set $biblioteca_api http://biblioteca-api:3001;
    location /api/ {
        proxy_pass $biblioteca_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
